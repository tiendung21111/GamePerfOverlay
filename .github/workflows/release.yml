name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file executable
        run: |
          dotnet publish GamePerfOverlay/GamePerfOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/

      - name: Create Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/GamePerfOverlay.exe" -DestinationPath "GamePerfOverlay-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GamePerfOverlay-${{ github.ref_name }}-win-x64.zip
            publish/GamePerfOverlay.exe
          generate_release_notes: true
